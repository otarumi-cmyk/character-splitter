<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>診断中 | ジョブリー建設</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #F5F7FC;
    color: #111827;
  }

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    text-align: center;
    padding: 10px 0;
    font-size: 12px;
    color: #4b5563;
    background: #ffffff;
    border-bottom: 1px solid rgba(15,23,42,.06);
  }

  .page-wrap {
    max-width: 380px;
    margin: 0 auto;
    padding: 72px 16px 40px;
  }

  .card {
    background: #ffffff;
    border-radius: 6px;
    box-shadow: 0 10px 25px rgba(15,23,42,.08);
    padding: 28px 20px 24px;
    text-align: center;
  }

  .card-title {
    font-size: 20px;
    font-weight: 800;
    color: #111827;
    margin-bottom: 12px;
  }

  .card-text {
    font-size: 13px;
    color: #4b5563;
    line-height: 1.8;
    margin-bottom: 24px;
  }

  .loader {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 3px solid #e5e7eb;
    border-top-color: #f97316;
    margin: 0 auto 10px;
    animation: spin 0.9s linear infinite;
  }

  .loader-text {
    font-size: 11px;
    color: #6b7280;
    letter-spacing: 0.08em;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="site-header"><img src="salary-diagnosis-assets/header-logo.png" alt="よりそい転職" style="height:28px;"></div>

<div class="page-wrap">
  <div class="card">
    <p class="card-title">診断中です…</p>
    <p class="card-text">
      あなたのご回答をもとに、<br>
      AIが適正年収とおすすめ求人を<br>
      分析しています。少々お待ちください。
    </p>
    <div class="loader"></div>
    <p class="loader-text">NOW ANALYZING</p>
  </div>
</div>

<script>
  // 3.5秒後に結果ページへ自動遷移
  setTimeout(function () {
    window.location.href = 'salary-diagnosis-result.html';
  }, 3500);
</script>

</body>
</html>
