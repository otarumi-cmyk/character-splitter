<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>現在の年収について | ジョブリー建設</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: #f0f2f5; color: #333; }

  .site-header {
    text-align: center; padding: 10px 16px;
    font-size: 12px; color: #888; letter-spacing: .5px;
    background: #fff; border-bottom: 1px solid #e8e8e8;
  }

  .salary-banner {
    background: #fff; text-align: center;
    padding: 14px 16px 10px;
    border-bottom: 1px solid #eee;
  }
  .salary-label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .salary-value {
    font-size: 20px; font-weight: 900; color: #1a1a2e;
    letter-spacing: 1px;
  }

  .step-section {
    background: #fff; padding: 14px 20px 16px;
    border-bottom: 1px solid #eee;
  }
  .step-label { font-size: 12px; color: #888; margin-bottom: 8px; text-align: center; }
  .step-dots {
    display: flex; align-items: center; justify-content: center; gap: 0;
  }
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .step-dot.done {
    background: #f97316; color: #fff;
  }
  .step-dot.current {
    background: #f97316; color: #fff;
    box-shadow: 0 0 0 3px rgba(249,115,22,.25);
  }
  .step-dot.pending {
    background: #e0e0e0; color: #999;
  }
  .step-line {
    flex: 1; height: 2px; background: #e0e0e0; max-width: 32px;
  }
  .step-line.done { background: #f97316; }

  .main { padding: 20px 14px 100px; max-width: 600px; margin: 0 auto; }

  .page-title {
    font-size: 18px; font-weight: 900; color: #1a1a2e;
    margin-bottom: 16px; line-height: 1.5;
  }

  .hint-text {
    font-size: 13px; color: #666;
    margin-bottom: 14px;
  }

  .income-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  @media (min-width: 480px) {
    .income-grid {
      grid-template-columns: repeat(2, minmax(0,1fr));
    }
  }

  .income-btn {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%;
    padding: 12px 12px;
    border-radius: 6px;
    border: 2px solid #f97316;
    background: #fff;
    color: #1a1a2e;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .income-btn span.label {
    flex: 1;
  }
  .income-btn span.arrow {
    color: #f97316; font-size: 18px; font-weight: 700;
    margin-left: 8px;
  }

  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid #e8e8e8;
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    max-width: 600px; margin: 0 auto;
  }
  .btn-back {
    font-size: 14px; font-weight: 700; color: #888;
    background: none; border: none; cursor: pointer;
    padding: 10px 16px;
  }
  .btn-next {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #f97316; color: #fff;
    font-size: 15px; font-weight: 700;
    padding: 13px 20px; border-radius: 6px;
    border: none; cursor: pointer;
  }

  .btn-next-arrow {
    width: 18px; height: 18px;
    filter: brightness(0) invert(1);
  }
</style>
</head>
<body>

<div class="site-header">
  <img src="salary-diagnosis-assets/header-logo.png" alt="よりそい転職" style="height:28px;">
</div>

<div class="salary-banner">
  <p class="salary-label">STEP1</p>
  <p class="salary-value">現在の年収について</p>
</div>

<div class="step-section">
  <p class="step-label">診断の流れ</p>
  <div class="step-dots">
    <div class="step-dot current">1</div>
    <div class="step-line"></div>
    <div class="step-dot pending">2</div>
    <div class="step-line"></div>
    <div class="step-dot pending">3</div>
    <div class="step-line"></div>
    <div class="step-dot pending">4</div>
    <div class="step-line"></div>
    <div class="step-dot pending">5</div>
  </div>
</div>

<main class="main">
  <h1 class="page-title">現在の年収を教えてください</h1>
  <p class="hint-text">おおよその年収レンジで大丈夫です。近いものを1つ選んでください。</p>

  <div class="income-grid">
    <button class="income-btn" onclick="selectIncome('income_100',1000000)">
      <span class="label">~100万円台</span><span class="arrow">›</span>
    </button>
    <button class="income-btn" onclick="selectIncome('income_200',2500000)">
      <span class="label">200万円台</span><span class="arrow">›</span>
    </button>
    <button class="income-btn" onclick="selectIncome('income_300',3500000)">
      <span class="label">300万円台</span><span class="arrow">›</span>
    </button>
    <button class="income-btn" onclick="selectIncome('income_400',4500000)">
      <span class="label">400万円台</span><span class="arrow">›</span>
    </button>
    <button class="income-btn" onclick="selectIncome('income_500',5500000)">
      <span class="label">500万円台</span><span class="arrow">›</span>
    </button>
    <button class="income-btn" onclick="selectIncome('income_600',6500000)">
      <span class="label">600万円台</span><span class="arrow">›</span>
    </button>
    <button class="income-btn" onclick="selectIncome('income_700',7500000)">
      <span class="label">700万円台</span><span class="arrow">›</span>
    </button>
    <button class="income-btn" onclick="selectIncome('income_800',8500000)">
      <span class="label">800万円台</span><span class="arrow">›</span>
    </button>
    <button class="income-btn" onclick="selectIncome('income_900',9500000)">
      <span class="label">900万円台</span><span class="arrow">›</span>
    </button>
    <button class="income-btn" onclick="selectIncome('income_1000',10000000)">
      <span class="label">1000万円以上</span><span class="arrow">›</span>
    </button>
  </div>
</main>

<div class="nav-bar">
  <button class="btn-back" type="button" onclick="history.back()">戻る</button>
  <button class="btn-next" type="button" onclick="goNextFromIncome()">
    次へ進む
    <img class="btn-next-arrow" src="salary-diagnosis-assets/guide-pointer.png" alt="">
  </button>
</div>

<script>
  function selectIncome(code, salary) {
    try {
      localStorage.setItem('diagnosisIncomeCode', code);
      localStorage.setItem('diagnosisSalary', String(salary));
    } catch (e) {
      // localStorage が使えない場合はスルー
    }
    window.location.href = 'salary-diagnosis-step.html';
  }

  function goNextFromIncome() {
    // 何も選択していない場合はそのまま次へ（既存フローに合わせてシンプルに）
    window.location.href = 'salary-diagnosis-step.html';
  }
</script>

</body>
</html>
