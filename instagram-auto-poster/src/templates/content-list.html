<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-color: #6C5CE7;
    --secondary-color: #FD79A8;
    --bg-color: #0F0A1A;
    --text-color: #FFFFFF;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    position: relative;
  }

  .background {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 10% 90%, rgba(108, 92, 231, 0.2) 0%, transparent 70%),
      radial-gradient(ellipse 50% 35% at 95% 10%, rgba(253, 121, 168, 0.15) 0%, transparent 70%),
      var(--bg-color);
  }

  /* Top accent bar */
  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--primary-color));
  }

  /* Decorative side stripe */
  .side-stripe {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
    opacity: 0.4;
  }

  /* Header */
  .header {
    position: relative;
    z-index: 1;
    padding: 52px 70px 0;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .header-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4);
  }

  .header-icon svg {
    width: 26px;
    height: 26px;
    fill: #fff;
  }

  .header-title {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #FFFFFF 30%, var(--secondary-color));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Divider line */
  .header-divider {
    margin: 24px 70px 0;
    height: 1px;
    background: linear-gradient(90deg, rgba(108, 92, 231, 0.4), rgba(253, 121, 168, 0.2), transparent);
  }

  /* Items list */
  .items {
    position: relative;
    z-index: 1;
    padding: 28px 70px 50px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 22px;
    padding: 22px 28px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 18px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
    border-radius: 0 2px 2px 0;
    opacity: 0.6;
  }

  .item-number {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(108, 92, 231, 0.35);
    margin-top: 2px;
  }

  .item-content {
    flex: 1;
    min-width: 0;
  }

  .item-title {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 6px;
    color: #fff;
  }

  .item-desc {
    font-size: 19px;
    font-weight: 400;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.55);
  }

  /* Subtle deco */
  .deco-corner {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 80px;
    height: 80px;
    border-right: 2px solid rgba(253, 121, 168, 0.15);
    border-bottom: 2px solid rgba(253, 121, 168, 0.15);
    border-radius: 0 0 16px 0;
  }

  .deco-circle-sm {
    position: absolute;
    bottom: 60px;
    left: 50px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    opacity: 0.25;
  }

  /* Swipe hint */
  .swipe-hint {
    position: absolute;
    bottom: 36px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 1;
  }

  .swipe-hint span {
    font-size: 16px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.3);
    letter-spacing: 0.1em;
  }

  .swipe-hint .arrow {
    display: inline-block;
    margin-left: 6px;
    color: rgba(253, 121, 168, 0.4);
  }
</style>
</head>
<body>
  <div class="background"></div>
  <div class="accent-bar"></div>
  <div class="side-stripe"></div>

  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6m-6 7h6m-6 4h6" stroke="white" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2 class="header-title">{{headerTitle}}</h2>
  </div>
  <div class="header-divider"></div>

  <div class="items">
    <div class="item">
      <div class="item-number">1</div>
      <div class="item-content">
        <div class="item-title">{{item1Title}}</div>
        <div class="item-desc">{{item1Desc}}</div>
      </div>
    </div>

    <div class="item">
      <div class="item-number">2</div>
      <div class="item-content">
        <div class="item-title">{{item2Title}}</div>
        <div class="item-desc">{{item2Desc}}</div>
      </div>
    </div>

    <div class="item">
      <div class="item-number">3</div>
      <div class="item-content">
        <div class="item-title">{{item3Title}}</div>
        <div class="item-desc">{{item3Desc}}</div>
      </div>
    </div>

    <div class="item">
      <div class="item-number">4</div>
      <div class="item-content">
        <div class="item-title">{{item4Title}}</div>
        <div class="item-desc">{{item4Desc}}</div>
      </div>
    </div>

    <div class="item">
      <div class="item-number">5</div>
      <div class="item-content">
        <div class="item-title">{{item5Title}}</div>
        <div class="item-desc">{{item5Desc}}</div>
      </div>
    </div>
  </div>

  <div class="deco-corner"></div>
  <div class="deco-circle-sm"></div>

  <div class="swipe-hint">
    <span>SWIPE <span class="arrow">&rsaquo;&rsaquo;</span></span>
  </div>
</body>
</html>
