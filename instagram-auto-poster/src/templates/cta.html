<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-color: #6C5CE7;
    --secondary-color: #FD79A8;
    --bg-color: #0F0A1A;
    --text-color: #FFFFFF;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    position: relative;
  }

  .background {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 70% at 50% 50%, rgba(108, 92, 231, 0.25) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 20% 80%, rgba(253, 121, 168, 0.2) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 20%, rgba(108, 92, 231, 0.15) 0%, transparent 60%),
      var(--bg-color);
  }

  /* Animated rings */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid;
  }

  .ring-1 {
    width: 600px;
    height: 600px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-color: rgba(108, 92, 231, 0.08);
  }

  .ring-2 {
    width: 450px;
    height: 450px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-color: rgba(253, 121, 168, 0.1);
  }

  .ring-3 {
    width: 300px;
    height: 300px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-color: rgba(108, 92, 231, 0.12);
  }

  /* Corner decorations */
  .corner-deco {
    position: absolute;
    width: 120px;
    height: 120px;
  }

  .corner-deco.top-left {
    top: 30px;
    left: 30px;
    border-top: 3px solid rgba(108, 92, 231, 0.3);
    border-left: 3px solid rgba(108, 92, 231, 0.3);
    border-radius: 16px 0 0 0;
  }

  .corner-deco.top-right {
    top: 30px;
    right: 30px;
    border-top: 3px solid rgba(253, 121, 168, 0.3);
    border-right: 3px solid rgba(253, 121, 168, 0.3);
    border-radius: 0 16px 0 0;
  }

  .corner-deco.bottom-left {
    bottom: 30px;
    left: 30px;
    border-bottom: 3px solid rgba(253, 121, 168, 0.3);
    border-left: 3px solid rgba(253, 121, 168, 0.3);
    border-radius: 0 0 0 16px;
  }

  .corner-deco.bottom-right {
    bottom: 30px;
    right: 30px;
    border-bottom: 3px solid rgba(108, 92, 231, 0.3);
    border-right: 3px solid rgba(108, 92, 231, 0.3);
    border-radius: 0 0 16px 0;
  }

  /* Floating particles */
  .particle {
    position: absolute;
    border-radius: 50%;
  }

  .particle-1 {
    width: 10px;
    height: 10px;
    background: var(--primary-color);
    top: 180px;
    left: 200px;
    opacity: 0.3;
  }

  .particle-2 {
    width: 6px;
    height: 6px;
    background: var(--secondary-color);
    top: 300px;
    right: 180px;
    opacity: 0.4;
  }

  .particle-3 {
    width: 8px;
    height: 8px;
    background: var(--primary-color);
    bottom: 280px;
    left: 160px;
    opacity: 0.25;
  }

  .particle-4 {
    width: 12px;
    height: 12px;
    background: var(--secondary-color);
    bottom: 220px;
    right: 140px;
    opacity: 0.2;
  }

  /* Star decorations */
  .star {
    position: absolute;
    width: 20px;
    height: 20px;
  }

  .star svg {
    width: 100%;
    height: 100%;
  }

  .star-1 {
    top: 140px;
    right: 240px;
    opacity: 0.3;
  }

  .star-2 {
    bottom: 200px;
    left: 240px;
    opacity: 0.25;
    transform: scale(0.7);
  }

  /* Main content */
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 80px 70px;
    text-align: center;
  }

  /* Pointing hand icon */
  .hand-icon {
    width: 90px;
    height: 90px;
    margin-bottom: 32px;
    filter: drop-shadow(0 8px 24px rgba(108, 92, 231, 0.4));
  }

  /* CTA text */
  .cta-text {
    font-size: 56px;
    font-weight: 900;
    line-height: 1.35;
    letter-spacing: -0.01em;
    margin-bottom: 40px;
    background: linear-gradient(135deg, #FFFFFF 0%, #FFFFFF 50%, var(--secondary-color) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    max-width: 850px;
  }

  /* Action buttons row */
  .actions {
    display: flex;
    gap: 20px;
    margin-bottom: 48px;
  }

  .action-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 32px;
    border-radius: 60px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
  }

  .action-pill .icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-pill .icon svg {
    width: 24px;
    height: 24px;
  }

  .action-pill .label {
    font-size: 22px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
  }

  /* Profile card */
  .profile-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 36px;
    background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(253, 121, 168, 0.15));
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    margin-bottom: 48px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  }

  .profile-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 22px;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(108, 92, 231, 0.4);
  }

  .profile-info {
    text-align: left;
  }

  .profile-handle {
    font-size: 24px;
    font-weight: 800;
    color: #fff;
  }

  .profile-label {
    font-size: 17px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 2px;
  }

  .follow-btn {
    margin-left: 20px;
    padding: 12px 32px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.03em;
    box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4);
  }

  /* Brand footer */
  .brand-footer {
    position: absolute;
    bottom: 44px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 1;
  }

  .brand-logo {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 16px;
    color: #fff;
  }

  .brand-text {
    font-size: 20px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.05em;
  }

  /* Glow effect */
  .glow-center {
    position: absolute;
    width: 400px;
    height: 400px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    background: radial-gradient(ellipse, rgba(108, 92, 231, 0.12) 0%, transparent 70%);
    filter: blur(50px);
    z-index: 0;
  }
</style>
</head>
<body>
  <div class="background"></div>

  <!-- Rings -->
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>

  <!-- Corner decorations -->
  <div class="corner-deco top-left"></div>
  <div class="corner-deco top-right"></div>
  <div class="corner-deco bottom-left"></div>
  <div class="corner-deco bottom-right"></div>

  <!-- Particles -->
  <div class="particle particle-1"></div>
  <div class="particle particle-2"></div>
  <div class="particle particle-3"></div>
  <div class="particle particle-4"></div>

  <!-- Stars -->
  <div class="star star-1">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="rgba(253, 121, 168, 0.5)"/>
    </svg>
  </div>
  <div class="star star-2">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="rgba(108, 92, 231, 0.5)"/>
    </svg>
  </div>

  <div class="glow-center"></div>

  <div class="content">
    <!-- Pointing hand SVG -->
    <div class="hand-icon">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6C5CE7"/>
            <stop offset="100%" stop-color="#FD79A8"/>
          </linearGradient>
        </defs>
        <!-- Down-pointing arrow icon -->
        <circle cx="50" cy="50" r="46" fill="url(#handGrad)" opacity="0.15"/>
        <circle cx="50" cy="50" r="46" stroke="url(#handGrad)" stroke-width="3" fill="none" opacity="0.6"/>
        <path d="M50 28V62M50 62L36 48M50 62L64 48" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="cta-text">{{ctaText}}</h1>

    <!-- Action pills -->
    <div class="actions">
      <div class="action-pill">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="#FD79A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="label">いいね</span>
      </div>
      <div class="action-pill">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" stroke="#6C5CE7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="label">保存</span>
      </div>
      <div class="action-pill">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13" stroke="#FD79A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="label">シェア</span>
      </div>
    </div>

    <!-- Profile card -->
    <div class="profile-card">
      <div class="profile-avatar">C</div>
      <div class="profile-info">
        <div class="profile-handle">{{profileText}}</div>
        <div class="profile-label">フォローして最新情報をチェック</div>
      </div>
      <div class="follow-btn">フォロー</div>
    </div>
  </div>

  <div class="brand-footer">
    <div class="brand-logo">C</div>
    <span class="brand-text">{{brandName}}</span>
  </div>
</body>
</html>
