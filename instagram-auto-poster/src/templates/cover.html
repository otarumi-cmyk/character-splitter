<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-color: #6C5CE7;
    --secondary-color: #FD79A8;
    --bg-color: #0F0A1A;
    --text-color: #FFFFFF;
    --title-text: 1.0;
    --subtitle-text: 1.0;
    --brand-name: 1.0;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    position: relative;
  }

  .background {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 80%, rgba(108, 92, 231, 0.35) 0%, transparent 70%),
      radial-gradient(ellipse 70% 50% at 85% 20%, rgba(253, 121, 168, 0.3) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(108, 92, 231, 0.15) 0%, transparent 60%),
      var(--bg-color);
  }

  .noise-overlay {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  /* Decorative elements */
  .deco-circle-1 {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    border: 2px solid rgba(253, 121, 168, 0.2);
    top: -80px;
    right: -60px;
  }

  .deco-circle-2 {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(108, 92, 231, 0.15), rgba(253, 121, 168, 0.1));
    bottom: 180px;
    left: -60px;
  }

  .deco-circle-3 {
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid rgba(108, 92, 231, 0.25);
    top: 200px;
    right: 80px;
  }

  .deco-line-1 {
    position: absolute;
    width: 200px;
    height: 3px;
    background: linear-gradient(90deg, var(--primary-color), transparent);
    top: 340px;
    left: 60px;
    border-radius: 2px;
  }

  .deco-line-2 {
    position: absolute;
    width: 140px;
    height: 3px;
    background: linear-gradient(270deg, var(--secondary-color), transparent);
    bottom: 320px;
    right: 60px;
    border-radius: 2px;
  }

  .deco-dots {
    position: absolute;
    top: 120px;
    left: 80px;
    display: grid;
    grid-template-columns: repeat(3, 8px);
    gap: 12px;
  }

  .deco-dots .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(253, 121, 168, 0.3);
  }

  .deco-dots .dot:nth-child(5) {
    background: rgba(108, 92, 231, 0.5);
  }

  .deco-diamond {
    position: absolute;
    width: 24px;
    height: 24px;
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    transform: rotate(45deg);
    bottom: 260px;
    right: 140px;
    border-radius: 4px;
    opacity: 0.4;
  }

  /* Content */
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 80px 70px;
    text-align: center;
  }

  .tag {
    display: inline-block;
    padding: 10px 28px;
    border-radius: 50px;
    background: linear-gradient(135deg, rgba(108, 92, 231, 0.3), rgba(253, 121, 168, 0.3));
    border: 1px solid rgba(255, 255, 255, 0.15);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.08em;
    margin-bottom: 40px;
    backdrop-filter: blur(10px);
    color: rgba(255, 255, 255, 0.9);
  }

  .title {
    font-size: 72px;
    font-weight: 900;
    line-height: 1.3;
    letter-spacing: -0.02em;
    margin-bottom: 36px;
    background: linear-gradient(135deg, #FFFFFF 0%, #FFFFFF 40%, var(--secondary-color) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    max-width: 900px;
  }

  .subtitle {
    font-size: 28px;
    font-weight: 500;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.7);
    max-width: 700px;
    letter-spacing: 0.02em;
  }

  .divider {
    width: 60px;
    height: 4px;
    background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
    border-radius: 2px;
    margin: 32px 0;
  }

  /* Brand footer */
  .brand-footer {
    position: absolute;
    bottom: 50px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 1;
  }

  .brand-logo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 18px;
    color: #fff;
    box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
  }

  .brand-text {
    font-size: 22px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 0.05em;
  }

  /* Glowing accent behind title */
  .glow {
    position: absolute;
    width: 500px;
    height: 200px;
    background: radial-gradient(ellipse, rgba(108, 92, 231, 0.2) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    filter: blur(40px);
    z-index: 0;
  }
</style>
</head>
<body>
  <div class="background"></div>
  <div class="noise-overlay"></div>

  <!-- Decorative elements -->
  <div class="deco-circle-1"></div>
  <div class="deco-circle-2"></div>
  <div class="deco-circle-3"></div>
  <div class="deco-line-1"></div>
  <div class="deco-line-2"></div>
  <div class="deco-dots">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
  <div class="deco-diamond"></div>
  <div class="glow"></div>

  <div class="content">
    <div class="tag">CAREER TIPS</div>
    <h1 class="title">{{title}}</h1>
    <div class="divider"></div>
    <p class="subtitle">{{subtitle}}</p>
  </div>

  <div class="brand-footer">
    <div class="brand-logo">C</div>
    <span class="brand-text">{{brandName}}</span>
  </div>
</body>
</html>
